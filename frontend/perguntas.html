<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gera perguntas de escolha múltipla com IA a partir de qualquer texto. Ideal para estudar ou preparar testes.">
  <meta name="robots" content="index, follow">
  <title>📘 Gerador de Perguntas com IA</title>
  <link rel="icon" href="/logos/ouviescreviicon.png" type="image/png">
  <link rel="stylesheet" href="css/ouviescrevi.css">
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page">
<a class="oe-skip" href="#conteudo">Saltar para o conteúdo</a>
<div id="header"></div>

<div class="oe-hero" id="conteudo">
  <h1>📘 Gerador de Perguntas com IA</h1>
  <p class="oe-lead">Cola aqui o teu texto e gera perguntas de escolha múltipla com respostas e explicações.</p>
</div>

<div class="container">
  <textarea id="texto" placeholder="Cola aqui o conteúdo a estudar..."></textarea>
  <button type="button" class="oe-btn oe-btn--block" id="btnPerguntas" onclick="gerarPerguntas()">🎓 Gerar Perguntas</button>
  <div id="resultado"></div>
</div>

<script src="js/ouviescrevi-api.js"></script>
<script>
  async function gerarPerguntas() {
    const texto = document.getElementById("texto").value.trim();
    const btn = document.getElementById("btnPerguntas");
    if (!texto) {
      OuviescreviUI.toast("Introduz texto para gerar perguntas.", "error");
      return;
    }
    OuviescreviUI.setButtonLoading(btn, true, "A gerar perguntas...");

    try {
      await OuviescreviAPI.init();
      const res = await fetch(`${OuviescreviAPI.getBase()}/generate-questions`, {
        method: "POST",
        headers: OuviescreviAPI.authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(OuviescreviAPI.authJson({ text: texto }))
      });
      const data = await res.json();
      const out = document.getElementById("resultado");
      if (data.questions) {
        out.textContent = data.questions;
        out.classList.remove("oe-result--error");
      } else {
        out.textContent = data.error || data.detail || "Erro inesperado.";
        out.classList.add("oe-result--error");
      }
    } catch (e) {
      OuviescreviUI.toast("Erro ao gerar perguntas.", "error");
      console.error(e);
    } finally {
      OuviescreviUI.setButtonLoading(btn, false);
    }
  }
</script>
<script>
  fetch("header.html")
    .then(response => response.text())
    .then(html => {
      document.getElementById("header").innerHTML = html;
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = html;
      tempDiv.querySelectorAll("script").forEach(oldScript => {
        const newScript = document.createElement("script");
        if (oldScript.src) newScript.src = oldScript.src;
        else newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
      if (window.OuviescreviUI) OuviescreviUI.markCurrentNav();
    });
  fetch("footer.html")
    .then(res => res.text())
    .then(html => {
      const f = document.createElement("div");
      f.id = "footer";
      f.innerHTML = html;
      document.body.appendChild(f);
    });
</script>
</body>
</html>
