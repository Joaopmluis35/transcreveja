<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Converte imagens entre PNG, JPEG, WebP, AVIF, BMP e GIF — gratuito, no browser, sem enviar ficheiros para o servidor.">
  <meta name="robots" content="index, follow">
  <title>🖼️ Conversor de Imagens</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="css/ouviescrevi.css?v=15">
  <link rel="stylesheet" href="css/conversor-imagens.css?v=2">
  <script src="js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro oe-page--conversor-imagens">
<a class="oe-skip" href="#conteudo">Saltar para o conteúdo</a>
<div id="header"></div>

<div class="oe-cimg-layout" id="conteudo">
  <header class="oe-cimg-hero">
    <h1 data-cms-key="conversor_imagens_title" data-cms-mode="text">🖼️ Conversor de Imagens</h1>
    <p class="oe-lead" data-cms-key="conversor_imagens_lead" data-cms-mode="text">Converte JPG, PNG, WebP, GIF e outros formatos — tudo no teu browser, privado e grátis.</p>
  </header>

  <section class="oe-cimg-card" aria-labelledby="cimgFormTitle">
    <h2 class="oe-visually-hidden" id="cimgFormTitle">Converter imagem</h2>

    <div class="oe-cimg-drop" id="cimgDrop" role="button" tabindex="0">
      <span class="oe-cimg-drop__icon" aria-hidden="true">🖼️</span>
      <p class="oe-cimg-drop__text"><strong id="cimgDropTitle">Arrasta imagens aqui</strong><br><span id="cimgDropHint">ou clica para escolher</span></p>
      <input type="file" id="cimgInput" accept="image/*" multiple>
    </div>

    <p class="oe-cimg-meta" id="cimgMeta"></p>
    <div class="oe-cimg-batch" id="cimgBatch" hidden></div>

    <div class="oe-cimg-options">
      <div>
        <label for="cimgFormat" id="cimgFormatLabel">Converter para</label>
        <select id="cimgFormat" aria-describedby="cimgFormatHint"></select>
        <p class="oe-cimg-format-hint" id="cimgFormatHint">PNG, JPEG, WebP, AVIF, BMP e GIF</p>
      </div>
      <div id="cimgQualityRow">
        <label for="cimgQuality" id="cimgQualityLabel">Qualidade (JPEG / WebP)</label>
        <div class="oe-cimg-quality">
          <input type="range" id="cimgQuality" min="40" max="100" value="90">
          <output id="cimgQualityOut" for="cimgQuality">90</output>
        </div>
      </div>
    </div>

    <div class="oe-cimg-actions">
      <button type="button" class="oe-cimg-btn" id="btnCimgConvert">🖼️ Converter e descarregar</button>
      <button type="button" class="oe-cimg-btn oe-cimg-btn--ghost" id="btnCimgClear">Limpar</button>
    </div>
    <p class="oe-cimg-status" id="cimgStatus" role="status" aria-live="polite"></p>

    <div class="oe-cimg-preview" id="cimgPreview" hidden>
      <h3 id="cimgPreviewTitle">Pré-visualização</h3>
      <img id="cimgPreviewImg" alt="">
    </div>
  </section>
</div>

<div id="footer"></div>

<script src="js/conversor-imagens-ui.js?v=2"></script>
<script>
  ConversorImagensUI.init({ lang: "pt" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
