<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Genera preguntas de opción múltiple con IA a partir de cualquier texto. Ideal para estudiar o preparar exámenes.">
  <title>📘 Generador de preguntas con IA</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css">
  <link rel="stylesheet" href="../css/perguntas.css?v=1">
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro">
<a class="oe-skip" href="#conteudo">Saltar al contenido</a>
<div id="header"></div>

<div class="oe-hero" id="conteudo">
  <h1 data-cms-key="es_perguntas_title" data-cms-mode="text">📘 Generador de preguntas con IA</h1>
  <p class="oe-lead" data-cms-key="es_perguntas_lead" data-cms-mode="text">Pega tu texto y genera preguntas de opción múltiple con respuestas y explicaciones.</p>
</div>

<div class="container">
  <textarea id="texto" placeholder="Pega aquí el contenido a estudiar..."></textarea>
  <button type="button" class="oe-btn oe-btn--block" id="btnPerguntas">🎓 Generar preguntas</button>
  <div id="resultado" class="oe-quiz-output" hidden></div>
</div>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/ouviescrevi-api.js"></script>
<script src="../js/perguntas-ui.js?v=1"></script>
<script>
  PerguntasUI.init({ lang: "es", numQuestions: 3 });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
