<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Genera título, descripción y etiquetas para YouTube con IA a partir de transcripciones y capítulos.">
  <meta name="robots" content="index, follow">
  <title>Descripción para YouTube con IA — Títulos y Etiquetas | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css?v=25">
  <link rel="stylesheet" href="../css/descricao-youtube.css?v=1">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js?v=25" defer></script>
</head>
<body class="oe-page oe-pro oe-page--youtube-desc">
<a class="oe-skip" href="#conteudo">Saltar al contenido</a>
<div id="header"></div>

<div class="oe-yt-layout" id="conteudo">
  <header class="oe-yt-hero">
    <h1 data-cms-key="es_youtube_desc_title" data-cms-mode="text">▶️ Descripción para YouTube</h1>
    <p class="oe-lead" data-cms-key="es_youtube_desc_lead" data-cms-mode="text">Pega la transcripción o resumen y obtén título, descripción y etiquetas listos para YouTube.</p>
  </header>

  <section class="oe-yt-form" aria-labelledby="ytFormTitle">
    <h2 class="oe-visually-hidden" id="ytFormTitle">Generar descripción</h2>
    <label for="ytTitleHint">Título sugerido (opcional)</label>
    <input type="text" id="ytTitleHint" placeholder="Ej.: Clase 3 — Revolución Industrial">
    <label for="texto">Transcripción o resumen</label>
    <textarea id="texto" placeholder="Pega aquí la transcripción o resumen del vídeo…"></textarea>
    <label for="ytChapters">Capítulos (opcional)</label>
    <textarea id="ytChapters" class="oe-yt-form__chapters" placeholder="0:00 Introducción&#10;2:15 Tema principal…"></textarea>
    <div class="oe-yt-form__footer">
      <div class="oe-yt-form__field">
        <label for="ytLang">Idioma</label>
        <select id="ytLang">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es" selected>Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <button type="button" class="oe-yt-form__submit" id="btnYoutube">▶️ Generar descripción</button>
    </div>
  </section>

  <div id="resultado" hidden></div>
</div>

<div id="footer"></div>

<script src="../js/ouviescrevi-api.js?v=25"></script>
<script src="../js/descricao-youtube-ui.js?v=1"></script>
<script>
  DescricaoYoutubeUI.init({ lang: "es" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
