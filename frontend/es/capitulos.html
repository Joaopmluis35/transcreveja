<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Divide transcripciones largas en capítulos con marcas de tiempo. Ideal para podcasts, clases y vídeos.">
  <meta name="robots" content="index, follow">
  <title>Capítulos y marcas de tiempo — Podcasts y YouTube | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css">
  <link rel="stylesheet" href="../css/capitulos.css?v=1">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro oe-page--capitulos">
<a class="oe-skip" href="#conteudo">Saltar al contenido</a>
<div id="header"></div>

<div class="oe-cap-layout" id="conteudo">
  <header class="oe-cap-hero">
    <h1 data-cms-key="es_capitulos_title" data-cms-mode="text">⏱️ Capítulos y marcas de tiempo</h1>
    <p class="oe-lead" data-cms-key="es_capitulos_lead" data-cms-mode="text">Pega una transcripción con marcas de tiempo y obtén capítulos organizados — listos para YouTube, podcasts o apuntes.</p>
  </header>

  <section class="oe-cap-form" aria-labelledby="capFormTitle">
    <h2 class="oe-visually-hidden" id="capFormTitle">Generar capítulos</h2>
    <p class="oe-ap-form__hint" id="capFormHint"></p>
    <textarea id="texto" aria-labelledby="capFormTitle"></textarea>
    <div class="oe-cap-form__footer">
      <div class="oe-cap-form__field">
        <label for="capLang">Idioma de los títulos</label>
        <select id="capLang">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es" selected>Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <div class="oe-cap-form__field">
        <label for="capMax">Máx. capítulos</label>
        <select id="capMax">
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12" selected>12</option>
          <option value="15">15</option>
        </select>
      </div>
      <button type="button" class="oe-cap-form__submit" id="btnCapitulos">⏱️ Generar capítulos</button>
    </div>
  </section>

  <div id="resultado" hidden></div>
</div>

<div id="footer"></div>

<script src="../js/ouviescrevi-api.js"></script>
<script src="../js/capitulos-ui.js?v=2"></script>
<script>
  CapitulosUI.init({ lang: "es" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
