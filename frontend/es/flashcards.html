<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Genera flashcards de estudio con IA a partir de texto o transcripción. Anverso y reverso — ideal para repasar.">
  <meta name="robots" content="index, follow">
  <title>Flashcards con IA — Estudio y Memorización | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css">
  <link rel="stylesheet" href="../css/flashcards.css?v=4">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro oe-page--flashcards">
<a class="oe-skip" href="#conteudo">Saltar al contenido</a>
<div id="header"></div>

<div class="oe-fc-layout" id="conteudo">
  <header class="oe-fc-hero">
    <h1 data-cms-key="es_flashcards_title" data-cms-mode="text">🃏 Flashcards con IA</h1>
    <p class="oe-lead" data-cms-key="es_flashcards_lead" data-cms-mode="text">Pega una transcripción o apuntes y obtén tarjetas de estudio (anverso/reverso) para repasar y memorizar.</p>
  </header>

  <section class="oe-fc-form" aria-labelledby="fcFormTitle">
    <h2 class="oe-visually-hidden" id="fcFormTitle">Generar flashcards</h2>
    <textarea id="texto"></textarea>
    <div class="oe-fc-form__footer">
      <div class="oe-fc-form__field">
        <label for="fcLang">Idioma de las tarjetas</label>
        <select id="fcLang">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es" selected>Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <div class="oe-fc-form__field">
        <label for="fcCount">N.º de tarjetas</label>
        <select id="fcCount">
          <option value="10">10</option>
          <option value="15" selected>15</option>
          <option value="20">20</option>
          <option value="25">25</option>
        </select>
      </div>
      <button type="button" class="oe-fc-form__submit" id="btnFlashcards">🃏 Generar flashcards</button>
    </div>
  </section>

  <div id="resultado" hidden></div>
</div>

<div id="footer"></div>

<script src="../js/ouviescrevi-api.js"></script>
<script src="../js/flashcards-export.js?v=1"></script>
<script src="../js/flashcards-ui.js?v=3"></script>
<script>
  FlashcardsUI.init({ lang: "es" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
