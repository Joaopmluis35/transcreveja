<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gera resumos automáticos a partir de links de artigos online com IA." />
  <meta name="keywords" content="resumo URL, resumo de artigo, resumo automático, IA, Ouviescrevi" />
  <meta name="robots" content="index, follow" />
  <title>Resumo por URL - Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescreviicon.png" type="image/png" />
  <link rel="stylesheet" href="css/ouviescrevi.css" />
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page">
<a class="oe-skip" href="#conteudo">Saltar para o conteúdo</a>

  <div id="header"></div>

  <div class="oe-hero" id="conteudo">
    <h1>🔗 Resumo Inteligente por URL</h1>
    <p class="oe-lead">Insere o link de um artigo ou página online para gerar um resumo automático com IA.</p>
  </div>

  <div class="container">
    <input type="url" id="urlInput" placeholder="https://exemplo.com/artigo" autocomplete="url" />
    <button type="button" class="oe-btn oe-btn--block" id="btnUrlResumo" onclick="resumirArtigoPorURL()">Gerar Resumo</button>

    <div class="progress-container" id="progressContainer" style="display: none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="loading-phrase" id="loadingPhrase"></div>

    <pre id="resultado" class="oe-result"></pre>
  </div>

  <script src="js/ouviescrevi-api.js"></script>
  <script>
    const frases = [
      "🔍 A ler o artigo com atenção...",
      "📚 A organizar as ideias principais...",
      "🧠 A pensar como um humano...",
      "✍️ A resumir com clareza...",
      "📦 A preparar a resposta final..."
    ];

    async function resumirArtigoPorURL() {
      const url = document.getElementById("urlInput").value.trim();
      const btn = document.getElementById("btnUrlResumo");
      const output = document.getElementById("resultado");
      const progressBar = document.getElementById("progressBar");
      const progressContainer = document.getElementById("progressContainer");
      const loadingPhrase = document.getElementById("loadingPhrase");

      if (!url) {
        OuviescreviUI.toast("Introduz um link válido.", "error");
        return;
      }

      OuviescreviUI.setButtonLoading(btn, true, "A resumir...");
      output.textContent = "";
      output.classList.remove("oe-result--error");
      progressContainer.style.display = "block";
      progressBar.style.width = "0%";

      let percent = 0;
      let fraseIndex = 0;

      const interval = setInterval(() => {
        if (percent >= 92) return;
        percent += Math.floor(Math.random() * 5) + 1;
        progressBar.style.width = percent + "%";
        loadingPhrase.textContent = frases[fraseIndex];
        fraseIndex = (fraseIndex + 1) % frases.length;
      }, 700);

      await OuviescreviAPI.init();
      fetch(`${OuviescreviAPI.getBase()}/summarize-url`, {
        method: "POST",
        headers: OuviescreviAPI.authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(OuviescreviAPI.authJson({ url: url }))
      })
      .then(res => res.json())
      .then(data => {
        clearInterval(interval);
        progressBar.style.width = "100%";
        loadingPhrase.textContent = "";
        if (data.summary) {
          output.textContent = data.summary;
        } else {
          output.textContent = data.error || data.detail || "Ocorreu um erro inesperado.";
          output.classList.add("oe-result--error");
        }
      })
      .catch(err => {
        clearInterval(interval);
        progressBar.style.width = "100%";
        loadingPhrase.textContent = "";
        console.error(err);
        output.textContent = "Erro ao contactar o servidor.";
        output.classList.add("oe-result--error");
      })
      .finally(() => {
        OuviescreviUI.setButtonLoading(btn, false);
        setTimeout(() => { progressContainer.style.display = "none"; }, 800);
      });
    }
  </script>

  <div id="footer"></div>
  <script>
    OuviescreviUI.loadHeader();
    OuviescreviUI.loadFooter();
  </script>

</body>
</html>
