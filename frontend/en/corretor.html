<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Correct spelling and grammar automatically with AI — free in your browser." />
  <meta name="robots" content="index, follow" />
  <title>AI Proofreader - Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png" />
  <link rel="stylesheet" href="../css/ouviescrevi.css?v=15" />
  <link rel="stylesheet" href="../css/corretor.css?v=3" />
  <script src="../js/theme-ui.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro oe-page--corretor">
<a class="oe-skip" href="#conteudo">Skip to content</a>
<div id="header"></div>
<div class="oe-cor-layout" id="conteudo">
  <header class="oe-cor-hero">
    <h1 data-cms-key="en_corretor_title" data-cms-mode="text">✍️ AI Text Proofreader</h1>
    <p class="oe-lead" data-cms-key="en_corretor_lead" data-cms-mode="text">Paste your text to fix spelling and grammar automatically.</p>
  </header>
  <div class="container oe-cor-page">
    <section class="oe-cor-form" aria-labelledby="corFormTitle">
      <div class="oe-cor-form__head">
        <p class="oe-cor-form__eyebrow" id="corFormEyebrow">Spelling · Grammar · Style</p>
        <h2 class="oe-cor-form__title" id="corFormTitle">Your text</h2>
        <p class="oe-cor-form__hint" id="corFormHint">Paste, type or upload a PDF/Word file.</p>
      </div>
      <div class="oe-cor-drop" id="corDropZone" role="button" tabindex="0">
        <span id="corDropLabel">Drag a PDF or Word (.docx) here, or click to choose</span>
        <input type="file" id="corFileInput" accept=".pdf,.docx" hidden />
      </div>
      <textarea id="textoInput" aria-labelledby="corFormTitle"></textarea>
      <p class="oe-cor-form__meta" id="corMeta">0 characters · 0 words</p>
      <p class="oe-cor-form__shortcut" id="corShortcutHint">Shortcut: Ctrl+Enter to correct</p>
      <div class="oe-cor-form__footer">
        <div class="oe-cor-form__mode">
          <label for="corModo" id="corModoLabel">Correction type</label>
          <select id="corModo">
            <option value="normal">Full</option>
            <option value="spelling">Spelling only</option>
            <option value="formal">Formal tone</option>
            <option value="simple">Simpler language</option>
          </select>
        </div>
        <button type="button" class="oe-cor-form__submit" id="btnCorrigir">Correct text</button>
      </div>
    </section>
    <div class="oe-cor-progress" id="corProgress" hidden>
      <div class="oe-cor-progress__track"><div class="oe-cor-progress__bar" id="progressBar"></div></div>
      <p class="oe-cor-progress__phrase" id="loadingPhrase"></p>
      <p class="oe-cor-progress__hint" id="corProgressHint"></p>
    </div>
    <div id="resultado" class="oe-cor-output" hidden></div>
    <section class="oe-cor-history" id="corHistoryPanel" hidden>
      <div id="corHistoryLogin">
        <p class="oe-cor-history__login" id="corHistoryLoginText"></p>
        <button type="button" class="oe-cor-history__login-btn" id="corHistoryLoginBtn"></button>
      </div>
      <div id="corHistoryLogged" hidden>
        <div class="oe-cor-history__head">
          <h2 class="oe-cor-history__title" id="corHistoryTitle"></h2>
          <button type="button" class="oe-cor-history__refresh" id="corHistoryRefresh"></button>
        </div>
        <ul class="oe-cor-history__list" id="corHistoryList"></ul>
        <p class="oe-cor-history__empty" id="corHistoryEmpty" hidden></p>
      </div>
    </section>
  </div>
</div>
<div id="footer"></div>
<script src="../js/ouviescrevi-api.js"></script>
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/corretor-files.js?v=1" defer></script>
<script src="../js/corretor-ui.js?v=3" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    CorretorUI.init({ lang: "en", apiLang: "en" });
    OuviescreviUI.loadHeader("header.html");
    OuviescreviUI.loadFooter("footer.html");
  });
</script>
</body>
</html>
