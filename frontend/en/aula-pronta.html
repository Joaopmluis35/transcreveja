<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Turn a lesson transcript into a complete study pack: summary, glossary, key points and quiz questions with answer key.">
  <meta name="robots" content="index, follow">
  <title>Lesson Ready — AI Study Pack | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css?v=15">
  <link rel="stylesheet" href="../css/aula-pronta.css?v=1">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro oe-page--aula-pronta">
<a class="oe-skip" href="#conteudo">Skip to content</a>
<div id="header"></div>

<div class="oe-ap-layout" id="conteudo">
  <header class="oe-ap-hero">
    <h1 data-cms-key="en_aula_pronta_title" data-cms-mode="text">📦 Lesson Ready</h1>
    <p class="oe-lead" data-cms-key="en_aula_pronta_lead" data-cms-mode="text">Paste a lesson transcript and get a full study pack: revision summary, glossary, key points and quiz questions with answer key.</p>
  </header>

  <section class="oe-ap-form" aria-labelledby="apFormTitle">
    <p class="oe-ap-form__eyebrow" id="apFormEyebrow">Teachers · Students · Revision</p>
    <h2 class="oe-ap-form__title" id="apFormTitle">Lesson text</h2>
    <p class="oe-ap-form__hint" id="apFormHint">Works with Ouviescrevi transcripts, notes or any long text.</p>
    <textarea id="texto" aria-labelledby="apFormTitle" placeholder="Paste the lesson transcript or notes here…"></textarea>
    <div class="oe-ap-form__footer">
      <div class="oe-ap-form__field">
        <label for="apLang" id="apLangLabel">Pack language</label>
        <select id="apLang" aria-labelledby="apLangLabel">
          <option value="pt">Português</option>
          <option value="en" selected>English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <div class="oe-ap-form__field">
        <label for="apNumQuestions" id="apCountLabel">Questions</label>
        <select id="apNumQuestions" aria-labelledby="apCountLabel">
          <option value="8">8</option>
          <option value="10" selected>10</option>
          <option value="12">12</option>
          <option value="15">15</option>
        </select>
      </div>
      <button type="button" class="oe-ap-form__submit" id="btnAulaPronta">📦 Generate pack</button>
    </div>
  </section>

  <div id="resultado" hidden></div>
</div>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/ouviescrevi-api.js"></script>
<script src="../js/perguntas-templates.js?v=4"></script>
<script src="../js/aula-pronta-ui.js?v=1"></script>
<script>
  AulaProntaUI.init({ lang: "en" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
