<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate AI study flashcards from any text or transcript. Front and back cards for revision and memorization.">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.ouviescrevi.pt/og/index.png">
  <meta name="twitter:description" content="Generate AI study flashcards from any text or transcript. Front and back cards for revision and memorization.">
  <meta property="og:description" content="Generate AI study flashcards from any text or transcript. Front and back cards for revision and memorization.">
  <meta name="twitter:title" content="AI Flashcards — Study & Memorization | Ouviescrevi">
  <meta property="og:title" content="AI Flashcards — Study & Memorization | Ouviescrevi">
  <meta property="og:url" content="https://www.ouviescrevi.pt/en/flashcards.html">
  <meta name="robots" content="index, follow">
  <title>AI Flashcards — Study & Memorization | Ouviescrevi</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="canonical" href="https://www.ouviescrevi.pt/en/flashcards.html">
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css?v=25">
  <link rel="stylesheet" href="../css/flashcards.css?v=6">
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js?v=25" defer></script>
</head>
<body class="oe-page oe-pro oe-page--flashcards">
<a class="oe-skip" href="#conteudo">Skip to content</a>
<div id="header"></div>

<div class="oe-fc-layout" id="conteudo">
  <header class="oe-fc-hero">
    <h1 data-cms-key="en_flashcards_title" data-cms-mode="text">🃏 AI Flashcards</h1>
    <p class="oe-lead" data-cms-key="en_flashcards_lead" data-cms-mode="text">Paste a transcript or notes and get study cards (front/back) for revision and memorization.</p>
  </header>

  <section class="oe-fc-form" aria-labelledby="fcFormTitle">
    <h2 class="oe-visually-hidden" id="fcFormTitle">Generate flashcards</h2>
    <textarea id="texto" placeholder="Paste lesson text or transcript here…"></textarea>
    <div class="oe-fc-form__footer">
      <div class="oe-fc-form__field">
        <label for="fcLang">Card language</label>
        <select id="fcLang">
          <option value="pt">Português</option>
          <option value="en" selected>English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <div class="oe-fc-form__field">
        <label for="fcCount">Number of cards</label>
        <select id="fcCount">
          <option value="10">10</option>
          <option value="15" selected>15</option>
          <option value="20">20</option>
          <option value="25">25</option>
        </select>
      </div>
      <button type="button" class="oe-fc-form__submit" id="btnFlashcards">🃏 Generate flashcards</button>
    </div>
  </section>

  <div id="resultado" hidden></div>
</div>

<div id="footer"></div>

<script src="../js/ouviescrevi-api.js?v=25"></script>
<script src="../js/flashcards-export.js?v=3"></script>
<script src="../js/flashcards-ui.js?v=4"></script>
<script>
  FlashcardsUI.init({ lang: "en" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
