<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate multiple-choice questions with AI from any text. Perfect for studying or preparing tests.">
  <meta name="robots" content="index, follow">
  <title>📘 AI Question Generator</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css">
  <link rel="stylesheet" href="../css/perguntas.css?v=3">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro oe-page--perguntas">
<a class="oe-skip" href="#conteudo">Skip to content</a>
<div id="header"></div>

<div class="oe-hero" id="conteudo">
  <h1 data-cms-key="en_perguntas_title" data-cms-mode="text">📘 AI Question Generator</h1>
  <p class="oe-lead" data-cms-key="en_perguntas_lead" data-cms-mode="text">Paste your text and generate multiple-choice questions with answers and explanations.</p>
</div>

<div class="container oe-quiz-page">
  <section class="oe-quiz-form" aria-labelledby="quizFormTitle">
    <div class="oe-quiz-form__head">
      <p class="oe-quiz-form__eyebrow" id="quizFormEyebrow">Study · Quizzes · Classes</p>
      <h2 class="oe-quiz-form__title" id="quizFormTitle">Source text</h2>
      <p class="oe-quiz-form__hint" id="quizFormHint">Paste a lesson, article or chapter. AI creates multiple-choice questions with answers and explanations.</p>
    </div>
    <textarea id="texto" aria-labelledby="quizFormTitle"></textarea>
    <div class="oe-quiz-form__footer">
      <label class="oe-quiz-form__count" for="quizNumQuestions">
        <span id="quizCountLabel">Number of questions</span>
        <select id="quizNumQuestions">
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="10">10</option>
        </select>
      </label>
      <button type="button" class="oe-quiz-form__submit" id="btnPerguntas">🎓 Generate Questions</button>
    </div>
  </section>
  <div id="resultado" class="oe-quiz-output" hidden></div>
</div>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/ouviescrevi-api.js"></script>
<script src="../js/perguntas-templates.js?v=1"></script>
<script src="../js/perguntas-ui.js?v=3"></script>
<script>
  PerguntasUI.init({ lang: "en", numQuestions: 3 });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
