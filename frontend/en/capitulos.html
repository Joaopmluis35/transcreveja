<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Split long transcripts into chapters with timestamps. Great for podcasts, lessons and videos — export for YouTube.">
  <meta name="robots" content="index, follow">
  <title>Chapters & Timestamps — Podcasts & YouTube | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css?v=25">
  <link rel="stylesheet" href="../css/capitulos.css?v=1">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js?v=25" defer></script>
</head>
<body class="oe-page oe-pro oe-page--capitulos">
<a class="oe-skip" href="#conteudo">Skip to content</a>
<div id="header"></div>

<div class="oe-cap-layout" id="conteudo">
  <header class="oe-cap-hero">
    <h1 data-cms-key="en_capitulos_title" data-cms-mode="text">⏱️ Chapters & timestamps</h1>
    <p class="oe-lead" data-cms-key="en_capitulos_lead" data-cms-mode="text">Paste a timestamped transcript (from Ouviescrevi) and get organized chapters — ready for YouTube, podcasts or study notes.</p>
  </header>

  <section class="oe-cap-form" aria-labelledby="capFormTitle">
    <h2 class="oe-visually-hidden" id="capFormTitle">Generate chapters</h2>
    <p class="oe-ap-form__hint" id="capFormHint">Works best with <code>[MM:SS]</code> blocks — like Ouviescrevi formatted transcription.</p>
    <textarea id="texto" aria-labelledby="capFormTitle" placeholder="Paste timestamped transcript here…"></textarea>
    <div class="oe-cap-form__footer">
      <div class="oe-cap-form__field">
        <label for="capLang">Chapter language</label>
        <select id="capLang">
          <option value="pt">Português</option>
          <option value="en" selected>English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <div class="oe-cap-form__field">
        <label for="capMax">Max chapters</label>
        <select id="capMax">
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12" selected>12</option>
          <option value="15">15</option>
        </select>
      </div>
      <button type="button" class="oe-cap-form__submit" id="btnCapitulos">⏱️ Generate chapters</button>
    </div>
  </section>

  <div id="resultado" hidden></div>
</div>

<div id="footer"></div>

<script src="../js/ouviescrevi-api.js?v=25"></script>
<script src="../js/capitulos-ui.js?v=1"></script>
<script>
  CapitulosUI.init({ lang: "en" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
