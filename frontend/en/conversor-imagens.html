<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert images between PNG, JPEG, WebP, AVIF, BMP and GIF — free, in your browser, files never leave your device.">
  <meta name="robots" content="index, follow">
  <title>🖼️ Image Converter</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css?v=15">
  <link rel="stylesheet" href="../css/conversor-imagens.css?v=2">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro oe-page--conversor-imagens">
<a class="oe-skip" href="#conteudo">Skip to content</a>
<div id="header"></div>

<div class="oe-cimg-layout" id="conteudo">
  <header class="oe-cimg-hero">
    <h1 data-cms-key="en_conversor_imagens_title" data-cms-mode="text">🖼️ Image Converter</h1>
    <p class="oe-lead" data-cms-key="en_conversor_imagens_lead" data-cms-mode="text">Convert JPG, PNG, WebP, GIF and more — entirely in your browser, private and free.</p>
  </header>

  <section class="oe-cimg-card" aria-labelledby="cimgFormTitle">
    <h2 class="oe-visually-hidden" id="cimgFormTitle">Convert image</h2>

    <div class="oe-cimg-drop" id="cimgDrop" role="button" tabindex="0">
      <span class="oe-cimg-drop__icon" aria-hidden="true">🖼️</span>
      <p class="oe-cimg-drop__text"><strong id="cimgDropTitle">Drop images here</strong><br><span id="cimgDropHint">or click to browse</span></p>
      <input type="file" id="cimgInput" accept="image/*" multiple>
    </div>

    <p class="oe-cimg-meta" id="cimgMeta"></p>
    <div class="oe-cimg-batch" id="cimgBatch" hidden></div>

    <div class="oe-cimg-options">
      <div>
        <label for="cimgFormat" id="cimgFormatLabel">Convert to</label>
        <select id="cimgFormat" aria-describedby="cimgFormatHint"></select>
        <p class="oe-cimg-format-hint" id="cimgFormatHint">PNG, JPEG, WebP, AVIF, BMP and GIF</p>
      </div>
      <div id="cimgQualityRow">
        <label for="cimgQuality" id="cimgQualityLabel">Quality (JPEG / WebP)</label>
        <div class="oe-cimg-quality">
          <input type="range" id="cimgQuality" min="40" max="100" value="90">
          <output id="cimgQualityOut" for="cimgQuality">90</output>
        </div>
      </div>
    </div>

    <div class="oe-cimg-actions">
      <button type="button" class="oe-cimg-btn" id="btnCimgConvert">🖼️ Convert and download</button>
      <button type="button" class="oe-cimg-btn oe-cimg-btn--ghost" id="btnCimgClear">Clear</button>
    </div>
    <p class="oe-cimg-status" id="cimgStatus" role="status" aria-live="polite"></p>

    <div class="oe-cimg-preview" id="cimgPreview" hidden>
      <h3 id="cimgPreviewTitle">Preview</h3>
      <img id="cimgPreviewImg" alt="">
    </div>
  </section>
</div>

<div id="footer"></div>

<script src="../js/conversor-imagens-ui.js?v=2"></script>
<script>
  ConversorImagensUI.init({ lang: "en" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
