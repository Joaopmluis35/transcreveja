<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Générez des questions à choix multiples avec l'IA à partir de n'importe quel texte. Idéal pour réviser ou préparer des tests.">
  <title>📘 Générateur de questions IA</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css">
  <link rel="stylesheet" href="../css/perguntas.css?v=1">
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro">
<a class="oe-skip" href="#conteudo">Aller au contenu</a>
<div id="header"></div>

<div class="oe-hero" id="conteudo">
  <h1 data-cms-key="fr_perguntas_title" data-cms-mode="text">📘 Générateur de questions IA</h1>
  <p class="oe-lead" data-cms-key="fr_perguntas_lead" data-cms-mode="text">Collez votre texte et générez des questions à choix multiples avec réponses et explications.</p>
</div>

<div class="container">
  <textarea id="texto" placeholder="Collez ici le contenu à étudier..."></textarea>
  <button type="button" class="oe-btn oe-btn--block" id="btnPerguntas">🎓 Générer des questions</button>
  <div id="resultado" class="oe-quiz-output" hidden></div>
</div>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/ouviescrevi-api.js"></script>
<script src="../js/perguntas-ui.js?v=1"></script>
<script>
  PerguntasUI.init({ lang: "fr", numQuestions: 3 });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
