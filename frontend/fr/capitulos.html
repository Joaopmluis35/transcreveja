<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Divisez de longues transcriptions en chapitres avec horodatages. Idéal pour podcasts et vidéos.">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.ouviescrevi.pt/og/index.png">
  <meta name="twitter:description" content="Divisez de longues transcriptions en chapitres avec horodatages. Idéal pour podcasts et vidéos.">
  <meta property="og:description" content="Divisez de longues transcriptions en chapitres avec horodatages. Idéal pour podcasts et vidéos.">
  <meta name="twitter:title" content="Chapitres et horodatages — Podcasts et YouTube | Ouviescrevi">
  <meta property="og:title" content="Chapitres et horodatages — Podcasts et YouTube | Ouviescrevi">
  <meta property="og:url" content="https://www.ouviescrevi.pt/fr/capitulos.html">
  <meta name="robots" content="index, follow">
  <title>Chapitres et horodatages — Podcasts et YouTube | Ouviescrevi</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="canonical" href="https://www.ouviescrevi.pt/fr/capitulos.html">
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css?v=25">
  <link rel="stylesheet" href="../css/capitulos.css?v=1">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js?v=25" defer></script>
</head>
<body class="oe-page oe-pro oe-page--capitulos">
<a class="oe-skip" href="#conteudo">Aller au contenu</a>
<div id="header"></div>

<div class="oe-cap-layout" id="conteudo">
  <header class="oe-cap-hero">
    <h1 data-cms-key="fr_capitulos_title" data-cms-mode="text">⏱️ Chapitres et horodatages</h1>
    <p class="oe-lead" data-cms-key="fr_capitulos_lead" data-cms-mode="text">Collez une transcription horodatée et obtenez des chapitres organisés — prêts pour YouTube, podcasts ou notes.</p>
  </header>

  <section class="oe-cap-form" aria-labelledby="capFormTitle">
    <h2 class="oe-visually-hidden" id="capFormTitle">Générer les chapitres</h2>
    <p class="oe-ap-form__hint" id="capFormHint"></p>
    <textarea id="texto" aria-labelledby="capFormTitle"></textarea>
    <div class="oe-cap-form__footer">
      <div class="oe-cap-form__field">
        <label for="capLang">Langue des titres</label>
        <select id="capLang">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr" selected>Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <div class="oe-cap-form__field">
        <label for="capMax">Chapitres max.</label>
        <select id="capMax">
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12" selected>12</option>
          <option value="15">15</option>
        </select>
      </div>
      <button type="button" class="oe-cap-form__submit" id="btnCapitulos">⏱️ Générer les chapitres</button>
    </div>
  </section>

  <div id="resultado" hidden></div>
</div>

<div id="footer"></div>

<script src="../js/ouviescrevi-api.js?v=25"></script>
<script src="../js/capitulos-ui.js?v=2"></script>
<script>
  CapitulosUI.init({ lang: "fr" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
