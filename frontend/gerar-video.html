<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cria vídeos com narração automática e legendas a partir de texto com inteligência artificial.">
  <meta name="robots" content="index, follow">
  <title>Gerar Vídeo com Voz e Legendas — IA | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="css/ouviescrevi.css">
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="js/ouviescrevi-ui.js" defer></script>
  <style>
    body.oe-page video {
      margin: 24px auto 0;
      max-width: min(100%, 480px);
      border-radius: var(--oe-radius);
      box-shadow: var(--oe-shadow);
      display: none;
    }
    #status { margin-top: 16px; font-weight: 600; min-height: 1.5em; }
  </style>
</head>
<body class="oe-page oe-pro">
<a class="oe-skip" href="#conteudo">Saltar para o conteúdo</a>
<div id="header"></div>

<div class="oe-hero" id="conteudo">
  <h1>🎥 Gerar Vídeo com Voz</h1>
  <p class="oe-lead">Escreve um texto e cria um vídeo com narração automática — funciona sem OpenAI.</p>
</div>

<div class="container">
  <textarea id="texto" placeholder="Escreve aqui o texto para o vídeo..."></textarea>
  <button type="button" class="oe-btn oe-btn--block" id="btnVideo" onclick="gerarVideo()">🎬 Gerar Vídeo</button>

  <div id="status"></div>
  <div class="progress-container" id="progressContainer" style="display: none;">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <video id="videoPlayer" controls></video>
</div>

<script src="js/ouviescrevi-api.js"></script>
<script>
  async function gerarVideo() {
    const texto = document.getElementById("texto").value.trim();
    const btn = document.getElementById("btnVideo");
    const status = document.getElementById("status");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const video = document.getElementById("videoPlayer");

    if (!texto) {
      OuviescreviUI.toast("Escreve um texto para o vídeo.", "error");
      return;
    }

    OuviescreviUI.setButtonLoading(btn, true, "A gerar vídeo...");
    status.textContent = "A preparar áudio e imagem...";
    video.style.display = "none";
    progressContainer.style.display = "block";
    progressBar.style.width = "15%";

    try {
      await OuviescreviAPI.init();
      progressBar.style.width = "45%";
      const res = await fetch(`${OuviescreviAPI.getBase()}/generate-video`, {
        method: "POST",
        headers: OuviescreviAPI.authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(OuviescreviAPI.authJson({
          text: texto,
          voice_lang: "pt",
          image_url: "https://placehold.co/720x1280/7c3aed/ffffff?text=Ouviescrevi"
        }))
      });
      progressBar.style.width = "85%";
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || data.error || "Erro ao gerar vídeo");

      const url = OuviescreviAPI.toAbsUrl(data.video_url || data.url);
      video.src = url;
      video.style.display = "block";
      status.textContent = "✅ Vídeo pronto!";
      progressBar.style.width = "100%";
      OuviescreviUI.toast("Vídeo gerado com sucesso!", "success");
    } catch (err) {
      status.textContent = "❌ " + (err.message || "Erro ao gerar vídeo");
      OuviescreviUI.toast(err.message || "Erro ao gerar vídeo", "error");
    } finally {
      OuviescreviUI.setButtonLoading(btn, false);
      setTimeout(() => { progressContainer.style.display = "none"; }, 1000);
    }
  }
</script>
<script>
  fetch("header.html").then(r => r.text()).then(html => {
    document.getElementById("header").innerHTML = html;
    const t = document.createElement("div");
    t.innerHTML = html;
    t.querySelectorAll("script").forEach(s => {
      const n = document.createElement("script");
      if (s.src) n.src = s.src; else n.textContent = s.textContent;
      document.body.appendChild(n);
    });
    if (window.OuviescreviUI) OuviescreviUI.markCurrentNav();
  });
  fetch("footer.html").then(r => r.text()).then(html => {
    const f = document.createElement("div");
    f.id = "footer";
    f.innerHTML = html;
    document.body.appendChild(f);
  });
</script>
</body>
</html>
