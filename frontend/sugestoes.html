<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Tens uma sugestão para o Ouviescrevi? Envia-nos ideias para melhorar ainda mais a nossa plataforma.">
  <meta name="keywords" content="sugestões Ouviescrevi, dar feedback, ideias para IA, melhorar plataforma, contribuir com sugestões">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Sugestões – Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescreviicon.png" type="image/png">
  <link rel="stylesheet" href="css/ouviescrevi.css">
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page">
<a class="oe-skip" href="#conteudo">Saltar para o conteúdo</a>
<div id="header"></div>

<div class="oe-hero" id="conteudo">
  <h1 data-cms-key="sugestoes_title" data-cms-mode="text">💡 Sugestões</h1>
  <p class="oe-lead" data-cms-key="sugestoes_lead" data-cms-mode="text">A tua ideia ajuda-nos a melhorar o Ouviescrevi.</p>
</div>

<section class="sugestoes">
  <form id="formSugestao">
    <input type="hidden" name="_captcha" value="false">
    <label for="nome" style="font-weight:600;">Nome (opcional)</label>
    <input type="text" id="nome" name="nome" placeholder="O teu nome">
    <label for="mensagem" style="font-weight:600;margin-top:12px;display:block;">Sugestão</label>
    <textarea id="mensagem" name="mensagem" placeholder="A tua sugestão..." required rows="6"></textarea>
    <button type="submit" class="btn-main oe-btn--block" id="btnSugestao">Enviar sugestão</button>
  </form>
</section>

<div id="footer"></div>

<script>
document.getElementById("formSugestao").addEventListener("submit", function(e) {
  e.preventDefault();
  const btn = document.getElementById("btnSugestao");
  OuviescreviUI.setButtonLoading(btn, true, "A enviar...");
  const nome = document.getElementById("nome").value;
  const mensagem = document.getElementById("mensagem").value;
  const base = (window.OuviescreviAPI && OuviescreviAPI.detectApiBase) ? OuviescreviAPI.detectApiBase() : "https://api.ouviescrevi.pt";

  fetch(base + "/api/suggestions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "omit",
    body: JSON.stringify({ nome: nome, mensagem: mensagem, lang: "pt" })
  })
  .then(function(response) {
    if (response.ok) {
      OuviescreviUI.toast("Obrigado pela tua sugestão!", "success");
      e.target.reset();
    } else {
      OuviescreviUI.toast("Erro ao enviar. Tenta novamente.", "error");
    }
  })
  .catch(function() {
    OuviescreviUI.toast("Erro de ligação. Verifica a internet.", "error");
  })
  .finally(function() {
    OuviescreviUI.setButtonLoading(btn, false);
  });
});

OuviescreviUI.loadHeader();
OuviescreviUI.loadFooter();
</script>
</body>
</html>
