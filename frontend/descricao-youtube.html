<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gera título, descrição e tags para YouTube com IA a partir de transcrições e capítulos. Ideal para podcasts e vídeos.">
  <meta name="robots" content="index, follow">
  <title>Descrição para YouTube com IA — Títulos e Tags | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="css/ouviescrevi.css?v=25">
  <link rel="stylesheet" href="css/descricao-youtube.css?v=1">
  <script src="js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="js/ouviescrevi-ui.js?v=25" defer></script>
</head>
<body class="oe-page oe-pro oe-page--youtube-desc">
<a class="oe-skip" href="#conteudo">Saltar para o conteúdo</a>
<div id="header"></div>

<div class="oe-yt-layout" id="conteudo">
  <header class="oe-yt-hero">
    <h1 data-cms-key="youtube_desc_title" data-cms-mode="text">▶️ Descrição para YouTube</h1>
    <p class="oe-lead" data-cms-key="youtube_desc_lead" data-cms-mode="text">Cola a transcrição ou resumo e obtém título, descrição e tags prontos a colar no YouTube.</p>
  </header>

  <section class="oe-yt-form" aria-labelledby="ytFormTitle">
    <h2 class="oe-visually-hidden" id="ytFormTitle">Gerar descrição</h2>
    <label for="ytTitleHint">Título sugerido (opcional)</label>
    <input type="text" id="ytTitleHint" placeholder="Ex.: Aula 3 — Revolução Industrial">
    <label for="texto">Transcrição ou resumo</label>
    <textarea id="texto" placeholder="Cola aqui a transcrição ou resumo do vídeo…"></textarea>
    <label for="ytChapters">Capítulos (opcional — cola do gerador de Capítulos)</label>
    <textarea id="ytChapters" class="oe-yt-form__chapters" placeholder="0:00 Introdução&#10;2:15 Tema principal…"></textarea>
    <div class="oe-yt-form__footer">
      <div class="oe-yt-form__field">
        <label for="ytLang">Idioma</label>
        <select id="ytLang">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <button type="button" class="oe-yt-form__submit" id="btnYoutube">▶️ Gerar descrição</button>
    </div>
  </section>

  <div id="resultado" hidden></div>
</div>

<div id="footer"></div>

<script src="js/ouviescrevi-api.js?v=25"></script>
<script src="js/descricao-youtube-ui.js?v=1"></script>
<script>
  DescricaoYoutubeUI.init({ lang: "pt" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
