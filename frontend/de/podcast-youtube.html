<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vom Transkript zu Kapiteln und YouTube-Beschreibung — geführter KI-Workflow für Podcasts und Videos.">
  <meta name="robots" content="index, follow">
  <title>Podcast- & YouTube-Assistent — Kapitel & Beschreibung | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css">
  <link rel="stylesheet" href="../css/descricao-youtube.css?v=1">
  <link rel="stylesheet" href="../css/podcast-youtube.css?v=1">
  <script src="../js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro oe-page--podcast-youtube">
<a class="oe-skip" href="#conteudo">Zum Inhalt springen</a>
<div id="header"></div>

<div class="oe-pw-layout" id="conteudo">
  <header class="oe-pw-hero">
    <h1 data-cms-key="de_podcast_youtube_title" data-cms-mode="text">🎙️ Podcast- & YouTube-Assistent</h1>
    <p class="oe-lead" data-cms-key="de_podcast_youtube_lead" data-cms-mode="text">Vom Transkript zu Kapiteln und YouTube-Beschreibung — drei KI-Schritte.</p>
  </header>

  <ol class="oe-pw-steps" aria-label="Schritte">
    <li id="pwStep1Label">1. Transkript</li>
    <li id="pwStep2Label">2. Kapitel</li>
    <li id="pwStep3Label">3. YouTube-Beschreibung</li>
  </ol>

  <section class="oe-pw-card" id="pwStep1">
    <h2 class="oe-pw-step-title" id="pwStep1Title">Transkript einfügen</h2>
    <p class="oe-pw-warn" id="pwStep1Hint"></p>
    <label for="pwTitleHint" id="pwTitleHintLabel">Episodentitel (optional)</label>
    <input type="text" id="pwTitleHint">
    <textarea id="texto"></textarea>
    <div class="oe-pw-footer">
      <div class="oe-pw-field">
        <label for="pwLang" id="pwLangLabel">Sprache</label>
        <select id="pwLang">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de" selected>Deutsch</option>
        </select>
      </div>
      <div class="oe-pw-field">
        <label for="pwMax" id="pwMaxLabel">Max. Kapitel</label>
        <select id="pwMax">
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12" selected>12</option>
          <option value="15">15</option>
        </select>
      </div>
      <button type="button" class="oe-pw-btn oe-pw-btn--purple" id="btnPwChapters">⏱️ Kapitel generieren</button>
    </div>
  </section>

  <section class="oe-pw-card" id="pwStep2" hidden>
    <h2 class="oe-pw-step-title" id="pwStep2Title">Kapitel fertig</h2>
    <p id="pwChaptersWarn" class="oe-pw-warn" hidden></p>
    <label id="pwChaptersPreviewLabel">Vorschau</label>
    <pre class="oe-pw-chapters-preview" id="pwChaptersPreview"></pre>
    <div class="oe-pw-footer">
      <button type="button" class="oe-pw-btn oe-pw-btn--ghost" id="btnPwBack">← Zurück</button>
      <button type="button" class="oe-pw-btn" id="btnPwYoutube">▶️ YouTube-Beschreibung generieren</button>
    </div>
  </section>

  <section id="pwStep3" hidden>
    <h2 class="oe-pw-step-title" id="pwStep3Title">YouTube-Beschreibung</h2>
    <div id="pwYoutubeResult"></div>
  </section>
</div>

<div id="footer"></div>

<script src="../js/ouviescrevi-api.js"></script>
<script src="../js/podcast-youtube-ui.js?v=1"></script>
<script>
  PodcastYoutubeUI.init({ lang: "de" });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
