<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Erstelle Multiple-Choice-Fragen mit KI aus beliebigem Text. Ideal zum Lernen oder für Tests.">
  <title>📘 KI-Fragengenerator</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png">
  <link rel="stylesheet" href="../css/ouviescrevi.css">
  <link rel="stylesheet" href="../css/perguntas.css?v=1">
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="../js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro">
<a class="oe-skip" href="#conteudo">Zum Inhalt springen</a>
<div id="header"></div>

<div class="oe-hero" id="conteudo">
  <h1 data-cms-key="de_perguntas_title" data-cms-mode="text">📘 KI-Fragengenerator</h1>
  <p class="oe-lead" data-cms-key="de_perguntas_lead" data-cms-mode="text">Füge deinen Text ein und erstelle Multiple-Choice-Fragen mit Antworten und Erklärungen.</p>
</div>

<div class="container">
  <textarea id="texto" placeholder="Füge hier den Lernstoff ein..."></textarea>
  <button type="button" class="oe-btn oe-btn--block" id="btnPerguntas">🎓 Fragen generieren</button>
  <div id="resultado" class="oe-quiz-output" hidden></div>
</div>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/ouviescrevi-api.js"></script>
<script src="../js/perguntas-ui.js?v=1"></script>
<script>
  PerguntasUI.init({ lang: "de", numQuestions: 3 });
  OuviescreviUI.loadHeader();
  OuviescreviUI.loadFooter();
</script>
</body>
</html>
