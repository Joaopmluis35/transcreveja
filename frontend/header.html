<header id="topoOuviescrevi">
  <div class="logo-area">
   <a href="https://www.ouviescrevi.pt/index.html"> <img src="/logos/ouviescrevimainlogo.png" alt="Ouviescrevi — transcrição com IA" /></a>
    
    <span class="oe-site-name" aria-hidden="true">Ouviescrevi</span>
    <div class="hourglass" style="margin-bottom:0px;"></div>

    <div class="language-selector">
      <button onclick="toggleLanguageMenu()" id="langBtn">
        <img src="/icons/pt.png" alt="PT" />
      </button>
      <div id="langDropdown" class="lang-menu">
        <button onclick="setLanguage('pt')"><img src="/icons/pt.png" alt="Português" /></button>
        <button onclick="setLanguage('en')"><img src="/icons/en.png" alt="English" /></button>
      </div>
    </div>
  </div>

  <button id="burgerBtn" type="button" onclick="toggleMenu()" aria-label="Abrir menu" aria-expanded="false" aria-controls="nichoMenu">
    <span id="burgerIcon">☰ Menu</span>
  </button>

  <nav id="nichoMenu">
    <button onclick="irParaNicho('index')"><span data-i18n="inicio">🏠 Início</span></button>
    <button onclick="irParaNicho('resumo')"><span>Resumo (PDF/Word)</span></button>
	 <button onclick="irParaNicho('url-resumo')"><span data-i18n="conversor">URL Resumo</span></button>
 <button onclick="irParaNicho('perguntas')"><span data-i18n="conversor">Perguntas Grátis</span></button>
    <button onclick="irParaNicho('conversor')"><span data-i18n="conversor">Conversor Grátis</span></button>
	  <button onclick="irParaNicho('corretor')"><span>Corretor de Texto</span></button> <!-- ✅ AQUI -->
    <button onclick="irParaNicho('ajuda')"><span data-i18n="ajuda">Ajuda</span></button>
    <button onclick="irParaNicho('sugestoes')"><span data-i18n="sugestoes">Sugestões</span></button>
  </nav>
</header>

<script>
  window.irParaNicho = function(pagina) {
    window.location.href = pagina + ".html";
  };

  window.toggleMenu = function() {
    const menu = document.getElementById("nichoMenu");
    const icon = document.getElementById("burgerIcon");
    const btn = document.getElementById("burgerBtn");

    menu.classList.toggle("show");
    const open = menu.classList.contains("show");
    icon.textContent = open ? "✕ Fechar" : "☰ Menu";
    if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
  };

  window.toggleLanguageMenu = function () {
    const dropdown = document.getElementById("langDropdown");
    dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
  };

  window.setLanguage = function (lang) {
  localStorage.setItem("lang", lang);
  
  const currentPath = window.location.pathname;
  const isInEN = currentPath.startsWith("/en");

  if (lang === "en" && !isInEN) {
    window.location.href = "/en/index.html";
  } else if (lang === "pt" && isInEN) {
    window.location.href = "/index.html";
  } else {
    location.reload();
  }
};


  // Fecha o menu de idioma ao clicar fora
  window.addEventListener("click", function (e) {
    const btn = document.getElementById("langBtn");
    const dropdown = document.getElementById("langDropdown");
    if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.style.display = "none";
    }
  });

  // Aplica a bandeira atual
  window.addEventListener("DOMContentLoaded", () => {
    const lang = localStorage.getItem("lang") || "pt";
    const langBtn = document.getElementById("langBtn");
    langBtn.innerHTML = `<img src="/icons/${lang}.png" alt="${lang}" />`;
  });
</script>
