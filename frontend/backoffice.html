<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backoffice | Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescreviicon.png" type="image/png">
  <link rel="stylesheet" href="css/ouviescrevi.css">
  <script src="js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-backoffice">
<a class="oe-skip" href="#painel">Saltar para o painel</a>

<h2>Backoffice Ouviescrevi</h2>

<form id="loginForm" class="oe-card oe-card--narrow">
  <p style="margin-top:0;color:var(--oe-text-muted);">Acesso restrito a administradores</p>
  <label for="password" style="display:block;text-align:left;font-weight:600;margin-top:12px;">Palavra-chave</label>
  <input type="password" id="password" placeholder="Palavra-chave" autocomplete="current-password">
  <button type="submit" class="oe-btn oe-btn--block">Entrar</button>
</form>

<div class="painel oe-card" id="painel" style="display:none">
  <p style="margin-top:0;"><strong>Bem-vindo, admin.</strong></p>
  <p id="contadorHoje">🔄 A carregar transcrições de hoje...</p>

  <label>
    <span>🛑 Modo Manutenção</span>
    <input type="checkbox" id="manutencaoToggle">
  </label>

  <p id="statusTexto"></p>

  <button type="button" class="oe-btn oe-btn--block" onclick="carregarLogs()">📊 Ver Estatísticas</button>
  <div id="tabelaLogs"></div>

  <button type="button" class="oe-btn oe-btn--block" onclick="logout()" style="margin-top:20px;background:#fee2e2;border-color:#fca5a5;">Sair</button>
</div>

<script src="js/ouviescrevi-api.js"></script>
<script>
  const form = document.getElementById("loginForm");
  const painel = document.getElementById("painel");
  const toggle = document.getElementById("manutencaoToggle");
  const statusTexto = document.getElementById("statusTexto");

  function apiBase() {
    return OuviescreviAPI.getBase() || OuviescreviAPI.detectApiBase();
  }

  function mostrarPainel() {
    form.style.display = "none";
    painel.style.display = "block";
    painel.id = "painel";
    carregarEstado();
  }

  if (OuviescreviUI && OuviescreviAPI.isAdminSession()) {
    mostrarPainel();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    try {
      await OuviescreviAPI.adminLogin(password);
      OuviescreviUI.toast("Sessão iniciada.", "success");
      mostrarPainel();
    } catch {
      OuviescreviUI.toast("Palavra-chave incorreta.", "error");
    }
  });

  async function carregarEstado() {
    try {
      const res = await fetch(`${apiBase()}/api/status`);
      const data = await res.json();
      toggle.checked = !!data.manutencao;
      statusTexto.textContent = data.manutencao ? "🛑 Site em manutenção" : "✅ Site operacional";
      statusTexto.style.color = data.manutencao ? "#b91c1c" : "#047857";
    } catch {
      statusTexto.textContent = "⚠️ Não foi possível carregar o estado.";
    }

    try {
      const res = await fetch(`${apiBase()}/transcricoes-hoje`, {
        headers: OuviescreviAPI.adminAuthHeaders()
      });
      const data = await res.json();
      document.getElementById("contadorHoje").textContent =
        "📊 Transcrições hoje: " + (data.total ?? data.count ?? "—");
    } catch {
      document.getElementById("contadorHoje").textContent = "📊 Transcrições hoje: —";
    }
  }

  toggle.addEventListener("change", async () => {
    try {
      const res = await fetch(`${apiBase()}/api/status`, {
        method: "POST",
        headers: OuviescreviAPI.adminAuthHeaders(),
        body: JSON.stringify({ manutencao: toggle.checked })
      });
      const data = await res.json();
      statusTexto.textContent = data.manutencao ? "🛑 Modo manutenção ativado" : "✅ Modo manutenção desativado";
      statusTexto.style.color = data.manutencao ? "#b91c1c" : "#047857";
      OuviescreviUI.toast(statusTexto.textContent, "success");
    } catch {
      OuviescreviUI.toast("Erro ao atualizar estado.", "error");
      toggle.checked = !toggle.checked;
    }
  });

  async function carregarLogs() {
    const div = document.getElementById("tabelaLogs");
    div.textContent = "A carregar...";
    try {
      const res = await fetch(`${apiBase()}/api/logs`, {
        headers: OuviescreviAPI.adminAuthHeaders()
      });
      const data = await res.json();
      const logs = Array.isArray(data) ? data : (data.logs || []);
      if (!logs.length) {
        div.textContent = "Sem registos.";
        return;
      }
      const table = document.createElement("table");
      table.className = "logs";
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      ["Ficheiro", "Data"].forEach(t => {
        const th = document.createElement("th");
        th.textContent = t;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      const tbody = document.createElement("tbody");
      logs.slice().reverse().slice(0, 50).forEach(row => {
        const tr = document.createElement("tr");
        const td1 = document.createElement("td");
        const td2 = document.createElement("td");
        td1.textContent = row.ficheiro || row.file || "—";
        td2.textContent = row.data || row.date || "—";
        tr.appendChild(td1);
        tr.appendChild(td2);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      div.textContent = "";
      div.appendChild(table);
    } catch {
      div.textContent = "Erro ao carregar logs.";
      OuviescreviUI.toast("Erro ao carregar logs.", "error");
    }
  }

  function logout() {
    OuviescreviAPI.adminLogout();
    painel.style.display = "none";
    form.style.display = "block";
    document.getElementById("password").value = "";
    OuviescreviUI.toast("Sessão terminada.");
  }
</script>
</body>
</html>
