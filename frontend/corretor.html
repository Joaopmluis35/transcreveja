<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Corrige textos automaticamente com inteligência artificial." />
  <meta name="keywords" content="corretor, texto, IA, gramatical, ortografia, Ouviescrevi" />
  <meta name="robots" content="index, follow" />
  <title>Corretor de Texto - Ouviescrevi</title>
  <link rel="icon" href="/logos/ouviescrevi-icon-pro.png" type="image/png" />
  <link rel="stylesheet" href="css/ouviescrevi.css?v=15" />
  <script src="js/theme-ui.js"></script>
  <script src="/js/ouviescrevi-seo.js" defer></script>
  <script src="js/ouviescrevi-ui.js" defer></script>
</head>
<body class="oe-page oe-pro">
<a class="oe-skip" href="#conteudo">Saltar para o conteúdo</a>
  <div id="header"></div>
  <div class="oe-hero" id="conteudo">
    <h1 data-cms-key="corretor_title" data-cms-mode="text">✍️ Corretor de Texto com IA</h1>
    <p class="oe-lead" data-cms-key="corretor_lead" data-cms-mode="text">Cola o teu texto para corrigir erros ortográficos e gramaticais automaticamente.</p>
  </div>

  <div class="container">
    <textarea id="textoInput" placeholder="Escreve ou cola aqui o teu texto..."></textarea>
    <button type="button" class="oe-btn oe-btn--block" id="btnCorrigir" onclick="corrigirTexto()">Corrigir Texto</button>

    <div class="progress-container" id="progressContainer" style="display: none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="loading-phrase" id="loadingPhrase"></div>

    <pre id="resultado" class="oe-result"></pre>
  </div>

  <script src="js/ouviescrevi-api.js"></script>
  <script>
    const frases = [
      "🔎 A ler o texto com atenção...",
      "🧠 A identificar erros gramaticais...",
      "✍️ A sugerir correções inteligentes...",
      "📘 A aplicar regras linguísticas...",
      "✅ A preparar o texto corrigido..."
    ];

    async function corrigirTexto() {
      const texto = document.getElementById("textoInput").value.trim();
      const btn = document.getElementById("btnCorrigir");
      const output = document.getElementById("resultado");
      const progressBar = document.getElementById("progressBar");
      const progressContainer = document.getElementById("progressContainer");
      const loadingPhrase = document.getElementById("loadingPhrase");

      if (!texto) {
        OuviescreviUI.toast("Introduz texto para corrigir.", "error");
        return;
      }

      OuviescreviUI.setButtonLoading(btn, true, "A corrigir...");
      output.textContent = "";
      output.classList.remove("oe-result--error");
      progressContainer.style.display = "block";
      progressBar.style.width = "0%";

      let percent = 0;
      let fraseIndex = 0;

      const interval = setInterval(() => {
        if (percent >= 92) return;
        percent += Math.floor(Math.random() * 5) + 1;
        progressBar.style.width = percent + "%";
        loadingPhrase.textContent = frases[fraseIndex];
        fraseIndex = (fraseIndex + 1) % frases.length;
      }, 700);

      await OuviescreviAPI.init();
      fetch(`${OuviescreviAPI.getBase()}/correct`, {
        method: "POST",
        headers: OuviescreviAPI.authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(OuviescreviAPI.authJson({ text: texto }))
      })
      .then(res => res.json())
      .then(data => {
        clearInterval(interval);
        progressBar.style.width = "100%";
        loadingPhrase.textContent = "";
        if (data.corrected) {
          output.textContent = data.corrected;
        } else {
          output.textContent = data.error || data.detail || "Ocorreu um erro inesperado.";
          output.classList.add("oe-result--error");
        }
      })
      .catch(err => {
        clearInterval(interval);
        progressBar.style.width = "100%";
        loadingPhrase.textContent = "";
        console.error(err);
        output.textContent = "Erro ao contactar o servidor.";
        output.classList.add("oe-result--error");
      })
      .finally(() => {
        OuviescreviUI.setButtonLoading(btn, false);
        setTimeout(() => { progressContainer.style.display = "none"; }, 800);
      });
    }
  </script>

  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(html => {
        const headerDiv = document.getElementById("header");
        headerDiv.innerHTML = html;
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = html;
        tempDiv.querySelectorAll("script").forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) newScript.src = oldScript.src;
          else newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript);
        });
        if (window.OuviescreviUI) OuviescreviUI.markCurrentNav();
      });
  </script>

  <div id="footer"></div>
  <script>
    fetch("footer.html")
      .then(res => res.text())
      .then(html => document.getElementById("footer").innerHTML = html);
  </script>

</body>
</html>
